<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1179px; height: 2556px; overflow: hidden; font-family: "Hiragino Sans", system-ui, sans-serif; color: #fff;
  background: radial-gradient(900px 700px at 90% 8%, #6c5ce7 0%, transparent 60%), radial-gradient(900px 700px at 0% 100%, #2f6bff 0%, transparent 55%), #0e1230; }
.cap { position: absolute; left: 0; right: 0; top: 150px; text-align: center; padding: 0 70px; }
h1 { font-size: 88px; font-weight: 900; line-height: 1.25; letter-spacing: -.01em; }
.grad { background: linear-gradient(90deg, #a9bbff, #e3c7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin-top: 30px; font-size: 42px; line-height: 1.55; opacity: .85; font-weight: 600; }
.phone { position: absolute; left: 50%; top: 720px; width: 880px; height: 1908px; margin-left: -440px; border-radius: 120px; padding: 26px;
  background: linear-gradient(145deg, #2c3150, #11142a); box-shadow: 0 50px 100px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.12); }
.phone img { width: 100%; height: 100%; border-radius: 96px; display: block; object-fit: cover; object-position: top; }
</style></head><body>
<div class="cap"><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><img id="img"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("h").innerHTML = q.get("h");
document.getElementById("p").innerHTML = q.get("p");
document.getElementById("img").src = "../raw/" + q.get("img") + ".png";
</script></body></html>
