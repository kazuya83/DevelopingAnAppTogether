name: DevelopingAnAppTogether
options:
  bundleIdPrefix: com.kazuya83
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # ここを自分の環境に合わせて変える（README の「iOS アプリ」を参照）
    DEVELOPMENT_TEAM: Y9YNQSMN52
    PRODUCT_BUNDLE_IDENTIFIER: com.kazuya83.developinganapptogether
    # Web（Cloudflare Workers）のドメイン。パスキーの Associated Domains にも使う
    WEB_APP_DOMAIN: developing-an-app-together.minna-dev.workers.dev
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  DevelopingAnAppTogether:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        # ファイル名（.app）は英字にする。日本語（濁点を含む）だと App Store へのアップロードで署名が合わなくなる。
        # ホーム画面の名前は Info.plist の CFBundleDisplayName（みんなでアプリ開発）
        PRODUCT_NAME: DevelopingAnAppTogether
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/App.Debug.entitlements
